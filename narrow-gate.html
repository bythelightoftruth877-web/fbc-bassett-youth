<title>The Narrow Gate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: I AM deck look (single dark theme) — photo hero, a row of five gate arches as progress, one puzzle panel at a time */
:root{
  --bg:#14100c; --panel:#2b241d; --panel-2:#352c23; --fg:#f5efe6; --muted:#c9b79c;
  --gold:#e8b04a; --ember:#e07b24; --good:#8fd0a6; --bad:#f08a6b; --line:rgba(201,183,156,.3);
  --display:Georgia, "Times New Roman", serif;
  --body:Calibri, Carlito, "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);font-family:var(--body)}
body{font-size:16px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.mark{display:block;width:38px;height:3px;background:var(--ember);margin-bottom:10px}
.label{font-size:.74rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
h1,h2{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0}
.primary{background:var(--gold);color:#1a120a;border:0;border-radius:8px;padding:14px 26px;font-weight:700;font-size:1.05rem;letter-spacing:.02em}
.primary:hover{background:#f0c066}
.primary:disabled{opacity:.4;cursor:default}
.ghost{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:10px 16px;font-weight:700;font-size:.9rem}
.ghost:hover{border-color:var(--gold);color:var(--fg)}

.back{display:inline-block;margin-bottom:14px;color:var(--muted);font-weight:700;font-size:.9rem;text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:8px 14px}
.back:hover{color:var(--fg);border-color:var(--gold)}

.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,16,12,.05) 20%,rgba(20,16,12,.92) 85%)}
.hero-in{position:relative;z-index:1;padding:22px}
.hero h1{font-size:clamp(2.4rem,8vw,3.6rem);line-height:1;margin:8px 0 6px}
.hero .sub{font-family:var(--display);font-style:italic;color:var(--gold);font-size:1.15rem;margin:0}
.intro{display:grid;gap:18px;margin-top:22px}
.verse{border-left:3px solid var(--gold);padding:2px 0 2px 16px;margin:0;font-family:var(--display);font-style:italic;font-size:1.08rem;line-height:1.55}
.verse cite{display:block;font-style:normal;font-family:var(--body);font-weight:700;letter-spacing:.14em;font-size:.72rem;color:var(--gold);margin-top:8px;text-transform:uppercase}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:8px;color:var(--muted);line-height:1.45}
.rules li{padding-left:22px;position:relative}
.rules li::before{content:"";position:absolute;left:4px;top:.55em;width:7px;height:7px;background:var(--ember);transform:rotate(45deg)}
.team{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.team input{flex:1 1 220px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--fg);font:inherit;padding:13px 14px}
.best{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}

/* hud */
.hud{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.gates{display:flex;gap:8px}
.arch{width:30px;height:38px;border:2px solid var(--line);border-bottom:0;border-radius:15px 15px 0 0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.85rem;color:var(--muted);transition:.3s}
.arch.now{border-color:var(--gold);color:var(--gold);box-shadow:0 -4px 14px rgba(232,176,74,.25)}
.arch.open{background:linear-gradient(180deg,#ffd27a,var(--ember));border-color:var(--gold);color:#1a120a}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.3rem;letter-spacing:.04em}
.clock small{display:block;font-size:.7rem;letter-spacing:.14em;color:var(--muted);text-align:right}
.pen{color:var(--bad);font-size:.85rem;font-weight:700;opacity:0;transition:opacity .2s;margin-right:6px}
.pen.show{opacity:1}

/* panel */
.panel{background:var(--panel);border-radius:12px;padding:22px 20px;border-top:4px solid var(--ember)}
.panel h2{font-size:clamp(1.5rem,4.5vw,2rem);margin:6px 0 8px}
.prompt{color:var(--muted);line-height:1.5;margin:0 0 18px;font-size:1.05rem}
.prompt strong{color:var(--fg)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:20px}
.hint{color:var(--gold);font-size:.95rem;line-height:1.45;margin:14px 0 0;padding:10px 12px;background:rgba(232,176,74,.08);border-radius:8px}
.msg{min-height:1.4em;font-weight:700;font-size:.95rem}
.msg.bad{color:var(--bad)}

/* choices */
.choices{display:grid;gap:10px}
.choice{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;font-family:var(--display);font-size:1.08rem;line-height:1.35}
.choice:hover{border-color:var(--gold)}
.choice.wrong{border-color:var(--bad);opacity:.5}

/* match */
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 12px}
.col{display:grid;gap:10px;align-content:start}
.colhead{font-size:.7rem;letter-spacing:.16em;font-weight:700;color:var(--muted);text-transform:uppercase}
.tile{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;min-height:76px;display:flex;flex-direction:column;gap:4px;transition:.2s}
.tile .r{font-size:.68rem;font-weight:700;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.tile .t{font-family:var(--display);font-size:.98rem;line-height:1.3}
.tile:hover{border-color:var(--gold)}
.tile.sel{border-color:var(--gold);background:#3a2f22;box-shadow:0 0 0 2px rgba(232,176,74,.35)}
.tile.done{border-color:var(--good);opacity:.55;cursor:default}
.tile.done .r::after{content:"  ✓";color:var(--good)}

/* words */
.slot{min-height:92px;border:1.5px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-bottom:14px;background:var(--bg)}
.slot:empty::before{content:"Tap the words in order";color:var(--muted);font-size:.9rem;padding:6px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.word{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 13px;font-family:var(--display);font-size:1.05rem}
.word:hover{border-color:var(--gold)}
.slot .word{background:#3a2f22;border-color:rgba(232,176,74,.5)}

/* sort */
.sort{display:grid;gap:10px}
.stmt{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:10px}
.stmt p{margin:0;font-family:var(--display);font-size:1.05rem;line-height:1.35}
.stmt.wrong{border-color:var(--bad)}
.tog{display:flex;gap:8px}
.tog button{flex:1;background:none;border:1px solid var(--line);border-radius:8px;padding:9px 6px;font-weight:700;font-size:.9rem;color:var(--muted)}
.tog button[aria-pressed="true"].real{background:var(--good);border-color:var(--good);color:#0f2418}
.tog button[aria-pressed="true"].fake{background:var(--bad);border-color:var(--bad);color:#2a0d05}

/* lock */
.lockverse{font-family:var(--display);font-size:clamp(1.2rem,3.6vw,1.5rem);line-height:1.5;margin:0 0 18px}
.lockverse .blank{display:inline-block;min-width:7ch;border-bottom:2px solid var(--gold);color:var(--gold);text-align:center}
.code{display:flex;flex-wrap:wrap;gap:10px}
.code input{flex:1 1 200px;min-width:0;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;color:var(--fg);font:inherit;font-size:1.2rem;padding:12px 14px;letter-spacing:.06em}

/* unlocked */
.unlocked{text-align:left}
.unlocked .big{font-family:var(--display);font-size:clamp(1.6rem,5vw,2.2rem);color:var(--gold);margin:6px 0 14px}
.unlocked .verse{margin-bottom:6px}
.why{color:var(--muted);line-height:1.5;margin:14px 0 0}

/* finish */
.finish .hero{min-height:380px}
.finish .hero::before{content:"";position:absolute;right:16%;top:20%;width:140px;height:260px;background:radial-gradient(ellipse at center,rgba(255,226,150,.85),rgba(255,180,80,0) 70%);z-index:1;animation:dawn 2.4s ease-out both;mix-blend-mode:screen}
@keyframes dawn{from{opacity:0;transform:scale(.4)}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px 0}
.stat{background:var(--panel);border-radius:10px;padding:14px 12px}
.stat b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums;font-family:var(--display)}
.stat span{font-size:.72rem;letter-spacing:.14em;color:var(--muted);font-weight:700;text-transform:uppercase}
.anchor{font-family:var(--display);font-size:clamp(1.6rem,5.4vw,2.4rem);line-height:1.15;margin:0 0 6px}
.anchor em{color:var(--gold);font-style:normal}
canvas{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (max-width:480px){.match{gap:8px}.tile{padding:9px 9px;min-height:84px}.tile .t{font-size:.9rem}.panel{padding:18px 14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app"></div>
<canvas id="fx"></canvas>

<script>
const PEN_WRONG=15, PEN_HINT=30;
const GATES=[
 {key:"name",title:"The Name",ref:"Exodus 3:14",
  prompt:"Moses asked God, “What is Your name?” <strong>Choose what God told him.</strong>",
  options:["I AM WHO I AM","The Lord of Hosts","The Ancient of Days","The God of Abraham"],answer:0,
  hint:"It’s the name Jesus used for Himself in John 8:58.",
  win:"God always exists.",
  v:"And God said to Moses, “I AM WHO I AM.” And He said, “Thus you shall say to the children of Israel, ‘I AM has sent me to you.’”",vr:"Exodus 3:14 NKJV",
  why:"No one made God. He has no beginning and needs nothing. Keep that name in mind for the next gate."},
 {key:"match",title:"The Ladder",ref:"Old Testament ↔ New Testament",
  prompt:"Everything God says about Himself, Jesus says too. <strong>Tap a truth about God, then the matching claim by Jesus.</strong>",
  pairs:[
   {l:["Exodus 3:14","God always exists."],r:["John 8:58","“Before Abraham was, I AM.”"]},
   {l:["Isaiah 43:10","No one is like Him."],r:["John 8:24","“…if you do not believe that I am He…”"]},
   {l:["Isaiah 41:4","First and Last."],r:["Revelation 1:17","“I am the First and the Last.”"]},
   {l:["Isaiah 44:24","He makes all things."],r:["John 1:3","“All things were made through Him.”"]}],
  hint:"Look for the same idea on both sides: always existing, no one like Him, First and Last, Maker of all.",
  win:"Every rung belongs to Jesus.",
  v:"Most assuredly, I say to you, before Abraham was, I AM.",vr:"John 8:58 NKJV",
  why:"The crowd understood exactly what Jesus claimed. They picked up stones (John 8:59)."},
 {key:"words",title:"Disciples Indeed",ref:"John 8:31",
  prompt:"Jesus told the people who believed Him what makes a real disciple. <strong>Build the verse.</strong> Two words don’t belong.",
  words:["If","you","abide","in","My","word,","you","are","My","disciples","indeed."],decoys:["agree","once"],
  hint:"It starts with “If you abide…” and ends with “indeed.”",
  win:"Real disciples stick with His Word.",
  v:"If you abide in My word, you are My disciples indeed. And you shall know the truth, and the truth shall make you free.",vr:"John 8:31–32 NKJV",
  why:"“Indeed” means for real. Following Jesus is not saying “I believe” once. It’s staying in His Word day after day."},
 {key:"sort",title:"Real or Counterfeit?",ref:"Know the real Jesus",
  prompt:"Many people use Jesus’ name but describe someone else. <strong>Mark each statement Real or Counterfeit.</strong>",
  items:[
   {t:"Jesus is Michael the archangel, a created being.",real:false,note:"Jehovah’s Witnesses teach this. But John 1:3 says all things were made through Him, so He can’t be one of the things made."},
   {t:"All things were made through Jesus.",real:true,note:"John 1:3."},
   {t:"Jesus is one god in a long line of gods.",real:false,note:"LDS teaching. But God says, “Before Me there was no God formed, nor shall there be after Me” (Isaiah 43:10)."},
   {t:"Jesus is the First and the Last.",real:true,note:"Revelation 1:17, the same title God claims in Isaiah 41:4."},
   {t:"Jesus was a prophet, but He was never crucified.",real:false,note:"Islam teaches this. But Jesus says, “I am He who lives, and was dead, and behold, I am alive forevermore” (Revelation 1:18)."}],
  hint:"Ask of each one: does this match the I AM who always exists, has no equal, and made everything?",
  win:"You can spot a counterfeit.",
  v:"For if he who comes preaches another Jesus whom we have not preached… you may well put up with it!",vr:"2 Corinthians 11:4 NKJV",
  why:""},
 {key:"lock",title:"The Work of God",ref:"John 6:28–29",
  prompt:"The crowd asked Jesus, “What shall we do, that we may work the works of God?” <strong>Type the missing word to open the last gate.</strong>",
  before:"This is the work of God, that you",after:"in Him whom He sent.",answer:["believe"],
  hint:"It’s not a work you do with your hands. It starts with B.",
  win:"",v:"",vr:"",why:""}
];

const app=document.getElementById("app");
const S={i:-1,start:0,pen:0,wrong:0,hints:0,team:"",timer:null,end:0};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=ms=>{const s=Math.max(0,Math.round(ms/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`};
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let best=null;try{best=JSON.parse(localStorage.getItem("narrow-gate-best")||"null")}catch(e){}

function startScreen(){
  clearInterval(S.timer);
  app.innerHTML=`<a class="back" href="index.html">← FBCB Youth page</a>
  <section class="hero"><div class="hero-in">
    <span class="mark"></span><span class="label">I AM &nbsp;·&nbsp; Escape Challenge</span>
    <h1>The Narrow Gate</h1><p class="sub">Five gates. One way through.</p>
  </div></section>
  <div class="intro">
    <blockquote class="verse">“Enter by the narrow gate; for wide is the gate and broad is the way that leads to destruction, and there are many who go in by it. Because narrow is the gate and difficult is the way which leads to life, and there are few who find it.”<cite>Matthew 7:13–14 NKJV</cite></blockquote>
    <ul class="rules">
      <li>Solve each gate to unlock the next. The clock runs the whole time.</li>
      <li>Every wrong answer adds ${PEN_WRONG} seconds. A hint costs ${PEN_HINT} seconds.</li>
      <li>Lowest time wins. Play as a team and compare times with the other groups.</li>
    </ul>
    <div class="team"><input id="team" type="text" maxlength="30" placeholder="Team name (optional)" value="${esc(S.team)}" aria-label="Team name"><button class="primary" id="go" type="button">Start the challenge</button></div>
    ${best?`<div class="best">Best time on this device: <b>${fmt(best.t)}</b>${best.team?` · ${esc(best.team)}`:""}</div>`:""}
  </div>`;
  document.getElementById("go").onclick=()=>{S.team=document.getElementById("team").value.trim();begin()};
}
function begin(){Object.assign(S,{i:0,start:Date.now(),pen:0,wrong:0,hints:0});S.timer=setInterval(tickClock,250);gate()}
function elapsed(){return (S.end||Date.now())-S.start+S.pen*1000}
function tickClock(){const c=document.getElementById("clock");if(c)c.textContent=fmt(elapsed())}
function hud(){
  return `<div class="hud"><div class="gates" aria-label="Gate ${S.i+1} of 5">${GATES.map((g,k)=>`<span class="arch ${k<S.i?"open":k===S.i?"now":""}">${k+1}</span>`).join("")}</div>
  <div style="display:flex;align-items:center"><span class="pen" id="pen">+${PEN_WRONG}s</span><div class="clock"><span id="clock">${fmt(elapsed())}</span><small>${S.team?esc(S.team).toUpperCase():"TIME"}</small></div></div></div>`;
}
function penalty(sec,el,text){
  S.pen+=sec;tickClock();const p=document.getElementById("pen");p.textContent=`+${sec}s`;p.classList.add("show");setTimeout(()=>p.classList.remove("show"),1100);
  if(el){el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake")}
  if(text){const m=document.getElementById("msg");if(m){m.textContent=text;m.className="msg bad"}}
}
function shell(g,body){
  app.innerHTML=hud()+`<section class="panel" id="panel">
    <span class="label">Gate ${S.i+1} · ${esc(g.ref)}</span><h2>${esc(g.title)}</h2><p class="prompt">${g.prompt}</p>
    ${body}
    <div id="hintbox"></div>
    <div class="foot"><span class="msg" id="msg"></span><span style="display:flex;gap:10px;flex-wrap:wrap" id="acts"><button class="ghost" id="hintbtn" type="button">Hint (+${PEN_HINT}s)</button></span></div>
  </section>`;
  document.getElementById("hintbtn").onclick=e=>{S.hints++;penalty(PEN_HINT);document.getElementById("hintbox").innerHTML=`<p class="hint">${esc(g.hint)}</p>`;e.target.disabled=true};
  window.scrollTo({top:0,behavior:reduce?"auto":"smooth"});
}
function gate(){
  const g=GATES[S.i];
  ({name:gName,match:gMatch,words:gWords,sort:gSort,lock:gLock})[g.key](g);
}
function gName(g){
  const order=shuffle(g.options.map((o,k)=>k));
  shell(g,`<div class="choices">${order.map(k=>`<button class="choice" type="button" data-k="${k}">${esc(g.options[k])}</button>`).join("")}</div>`);
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    if(+b.dataset.k===g.answer)unlocked(g);else if(!b.classList.contains("wrong")){S.wrong++;b.classList.add("wrong");penalty(PEN_WRONG,b,"Not that one. Try again.")}
  });
}
function gMatch(g){
  const rOrder=shuffle(g.pairs.map((p,k)=>k));
  shell(g,`<div class="match">
    <div class="col"><div class="colhead">God in the Old Testament</div>${g.pairs.map((p,k)=>`<button class="tile" type="button" data-side="l" data-k="${k}"><span class="r">${esc(p.l[0])}</span><span class="t">${esc(p.l[1])}</span></button>`).join("")}</div>
    <div class="col"><div class="colhead">Jesus said</div>${rOrder.map(k=>`<button class="tile" type="button" data-side="r" data-k="${k}"><span class="r">${esc(g.pairs[k].r[0])}</span><span class="t">${esc(g.pairs[k].r[1])}</span></button>`).join("")}</div>
  </div>`);
  let sel=null,done=0;
  app.querySelectorAll(".tile").forEach(t=>t.onclick=()=>{
    if(t.classList.contains("done"))return;
    if(!sel||sel.dataset.side===t.dataset.side){if(sel)sel.classList.remove("sel");sel=t;t.classList.add("sel");return}
    if(sel.dataset.k===t.dataset.k){[sel,t].forEach(x=>{x.classList.remove("sel");x.classList.add("done");x.disabled=true});sel=null;done++;
      const m=document.getElementById("msg");m.className="msg";m.textContent=`${done} of 4 matched`;
      if(done===4)setTimeout(()=>unlocked(g),reduce?0:400)}
    else{S.wrong++;const a=sel;a.classList.remove("sel");sel=null;penalty(PEN_WRONG,t,"Those two don’t match.");a.classList.add("shake")}
  });
}
function gWords(g){
  const pool=shuffle([...g.words,...g.decoys].map((w,k)=>({w,k})));
  shell(g,`<div class="slot" id="slot"></div><div class="bank" id="bank">${pool.map(p=>`<button class="word" type="button" data-k="${p.k}">${esc(p.w)}</button>`).join("")}</div>`);
  const acts=document.getElementById("acts");
  acts.insertAdjacentHTML("beforeend",`<button class="ghost" id="clr" type="button">Clear</button><button class="primary" id="chk" type="button">Unlock</button>`);
  const slot=document.getElementById("slot"),bank=document.getElementById("bank");
  const move=e=>{const w=e.target.closest(".word");if(!w)return;(w.parentElement===bank?slot:bank).appendChild(w)};
  slot.addEventListener("click",move);bank.addEventListener("click",move);
  document.getElementById("clr").onclick=()=>[...slot.children].forEach(c=>bank.appendChild(c));
  document.getElementById("chk").onclick=()=>{
    const got=[...slot.children].map(c=>c.textContent).join(" ");
    if(got===g.words.join(" "))unlocked(g);
    else{S.wrong++;penalty(PEN_WRONG,slot,got.split(" ").length<g.words.length?"Not finished yet. Keep building.":"Not quite. Check the order and the extra words.")}
  };
}
function gSort(g){
  shell(g,`<div class="sort">${g.items.map((it,k)=>`<div class="stmt" id="st${k}"><p>${esc(it.t)}</p><div class="tog"><button type="button" class="real" data-k="${k}" data-v="1" aria-pressed="false">Real</button><button type="button" class="fake" data-k="${k}" data-v="0" aria-pressed="false">Counterfeit</button></div></div>`).join("")}</div>`);
  const ans={};
  app.querySelectorAll(".tog button").forEach(b=>b.onclick=()=>{
    ans[b.dataset.k]=b.dataset.v==="1";
    b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    document.getElementById("st"+b.dataset.k).classList.remove("wrong");
  });
  document.getElementById("acts").insertAdjacentHTML("beforeend",`<button class="primary" id="chk" type="button">Unlock</button>`);
  document.getElementById("chk").onclick=()=>{
    if(Object.keys(ans).length<g.items.length){const m=document.getElementById("msg");m.className="msg bad";m.textContent="Mark all five first.";return}
    const bad=g.items.map((it,k)=>it.real!==ans[k]?k:-1).filter(k=>k>=0);
    if(!bad.length)unlocked(g);
    else{S.wrong++;bad.forEach(k=>{const el=document.getElementById("st"+k);el.classList.add("wrong")});penalty(PEN_WRONG,document.getElementById("panel"),`${bad.length} ${bad.length===1?"is":"are"} wrong. Look again at the red ones.`)}
  };
}
function gLock(g){
  shell(g,`<p class="lockverse">“${esc(g.before)} <span class="blank">?</span> ${esc(g.after)}”</p>
    <form class="code" id="form"><input id="code" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Missing word" aria-label="Missing word"><button class="primary" type="submit">Open the gate</button></form>`);
  const inp=document.getElementById("code");
  document.getElementById("form").addEventListener("submit",e=>{
    e.preventDefault();const v=inp.value.trim().toLowerCase().replace(/[^a-z]/g,"");
    if(!v)return;
    if(g.answer.includes(v)){app.querySelector(".blank").textContent=g.answer[0];finish()}
    else{S.wrong++;penalty(PEN_WRONG,inp,"The gate stays shut. Try again.");inp.select()}
  });
}
function unlocked(g){
  confetti(70);
  const sortNotes=g.key==="sort"?`<div class="sort" style="margin-top:14px">${g.items.map(it=>`<div class="stmt"><p>${esc(it.t)}</p><span style="font-weight:700;color:${it.real?"var(--good)":"var(--bad)"}">${it.real?"Real":"Counterfeit"}</span><span style="color:var(--muted);line-height:1.45">${esc(it.note)}</span></div>`).join("")}</div>`:"";
  app.innerHTML=hud().replace(`arch now">${S.i+1}`,`arch open">${S.i+1}`)+`<section class="panel unlocked">
    <span class="label">Gate ${S.i+1} unlocked</span>
    <div class="big">${esc(g.win)}</div>
    <blockquote class="verse">“${esc(g.v)}”<cite>${esc(g.vr)}</cite></blockquote>
    ${g.why?`<p class="why">${esc(g.why)}</p>`:""}${sortNotes}
    <div class="foot"><span></span><button class="primary" id="next" type="button">On to Gate ${S.i+2}</button></div>
  </section>`;
  document.getElementById("next").onclick=()=>{S.i++;gate()};
  document.getElementById("next").focus();
}
function finish(){
  S.end=Date.now();clearInterval(S.timer);const t=elapsed();
  let isBest=false;if(!best||t<best.t){best={t,team:S.team};isBest=true;try{localStorage.setItem("narrow-gate-best",JSON.stringify(best))}catch(e){}}
  setTimeout(()=>{
    confetti(300);
    app.innerHTML=`<div class="finish">
    <section class="hero"><div class="hero-in">
      <span class="mark"></span><span class="label">All five gates open</span>
      <h1>You found the narrow gate</h1><p class="sub">${S.team?esc(S.team)+" made it through.":"You made it through."}</p>
    </div></section>
    <div class="stats">
      <div class="stat"><b>${fmt(t)}</b><span>${isBest?"New best":"Final time"}</span></div>
      <div class="stat"><b>${S.wrong}</b><span>Wrong tries</span></div>
      <div class="stat"><b>${S.hints}</b><span>Hints</span></div>
    </div>
    <section class="panel">
      <p class="anchor">Only the real Jesus saves.<br><em>Know Him. Make Him known.</em></p>
      <blockquote class="verse" style="margin-top:16px">“This is the work of God, that you believe in Him whom He sent.”<cite>John 6:29 NKJV</cite></blockquote>
      <p class="why">The narrow gate is not a puzzle you solve. It’s a Person you trust. Jesus said, “I am the door. If anyone enters by Me, he will be saved” (John 10:9).</p>
      <div class="foot"><span class="best">Show this screen to your leader.</span><span style="display:flex;gap:10px;flex-wrap:wrap"><a class="ghost" style="text-decoration:none" href="index.html">Back to youth page</a><button class="ghost" id="again" type="button">Play again</button></span></div>
    </section></div>`;
    document.getElementById("again").onclick=()=>{S.end=0;startScreen()};
    window.scrollTo({top:0,behavior:reduce?"auto":"smooth"});
  },reduce?0:600);
}

const cv=document.getElementById("fx"),cx=cv.getContext("2d");let parts=[],raf=null;
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
size();addEventListener("resize",size);
function confetti(n){
  if(reduce)return;const cols=["#e8b04a","#e07b24","#f5efe6","#ffd27a"];
  for(let k=0;k<n;k++){const a=-Math.PI/2+(Math.random()-.5)*2.2,sp=6+Math.random()*9;
    parts.push({x:innerWidth/2,y:innerHeight*.45,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:Math.random()*6,w:5+Math.random()*6,h:3+Math.random()*5,c:cols[k%4],life:140+Math.random()*60})}
  if(!raf)tick();
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life-->0&&p.y<innerHeight+20);
  parts.forEach(p=>{p.vy+=.25;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=.15;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
  raf=parts.length?requestAnimationFrame(tick):null;
}
startScreen();
</script>

</body></html>
