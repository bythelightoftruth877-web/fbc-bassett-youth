<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>FBC Bassett Youth</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Rubik:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap"><style id="page-style">
/* Layout: a church-van "departure board" — name band, this week's meetings, upcoming trips as rows with big leave times, then contact + message. */
:root{
  /* single deliberate look: the flyer's neon-on-black */
  --bg:#0b0912; --surface:#17131f; --ink:#f4f1fa; --muted:#aca4c0; --line:#2d2640;
  --purple:#c04dff; --mint:#2ef0c2; --lime:#a8f23c; --pink:#ff3fa6; --orange:#ff8a2b;
  --accent:#2ef0c2; --accent-ink:#0b0912; --link:#7fe9ff; --band:#0b0912; --band-ink:#f4f1fa;
  --warn-bg:#2a1240; --ok:#a8f23c;
  --f-display:"Anton",Impact,"Arial Narrow",sans-serif;
  --f-head:"Rubik",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Source Sans 3",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body)}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--f-display);font-weight:400;text-transform:uppercase;letter-spacing:.01em}
h3{font-family:var(--f-head);font-weight:800;text-wrap:balance;margin:0;line-height:1.15}
.band{background:radial-gradient(120% 140% at 0% 0%,#3a1466 0%,transparent 55%),radial-gradient(90% 120% at 100% 100%,#0e3b3a 0%,transparent 60%),var(--band);color:var(--band-ink)}
.brand{display:flex;gap:16px;align-items:center;min-width:0}
.logo{width:92px;height:auto;border-radius:12px;flex:none;box-shadow:0 0 0 2px var(--purple),0 0 18px rgba(192,77,255,.45)}
.band .wrap{padding-block:28px 24px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
.band h1{font-size:clamp(34px,8vw,64px);line-height:.95;background:linear-gradient(90deg,var(--purple),var(--pink) 55%,var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
.band .church{font-size:15px;opacity:.8;margin-top:4px}
.stripe{height:8px;background:linear-gradient(90deg,var(--purple),var(--pink),var(--orange),var(--lime),var(--mint))}
.eyebrow{font:700 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.notice{background:var(--warn-bg);border-bottom:1px solid var(--line)}
.notice .wrap{padding-block:12px;font-weight:600}
main .wrap{display:grid;gap:40px;padding-block:32px 56px}
section{display:grid;gap:14px;min-width:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(28px,5vw,38px);color:var(--mint)}
#ev{color:var(--purple)}
#ct{color:var(--pink)}
.meetings{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.meet{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:4px;min-width:0}
.meet .day{font:700 13px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.meet h3{font-size:20px}
.meet{border-top:4px solid var(--c,var(--mint))}
.meet:nth-child(3n+1){--c:var(--purple)}.meet:nth-child(3n+2){--c:var(--lime)}.meet:nth-child(3n){--c:var(--pink)}
.meet .time{color:var(--c);font:800 24px/1.2 var(--f-head);font-variant-numeric:tabular-nums}
.meet .where,.meet .note{color:var(--muted);font-size:15px}
.board{display:grid;border:1px solid var(--line);box-shadow:0 0 0 1px rgba(192,77,255,.15),0 0 30px rgba(192,77,255,.12);border-radius:10px;overflow:hidden;background:var(--surface)}
.trip{--c:var(--purple)}
.trip:nth-child(5n+2){--c:var(--lime)}.trip:nth-child(5n+3){--c:var(--pink)}.trip:nth-child(5n+4){--c:var(--mint)}.trip:nth-child(5n){--c:var(--orange)}
.trip{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 20px;padding:18px;border-top:1px solid var(--line)}
.trip:first-child{border-top:0}
.trip .when{display:grid;gap:2px;align-content:start}
.trip .date{display:grid;justify-items:start;color:var(--c);font-family:var(--f-display);text-transform:uppercase}
.trip .date .dn{font-size:58px;line-height:.9}
.trip .date .mo{font-size:24px;line-height:1}
.trip .date .wd{font:700 11px/1 var(--f-mono);letter-spacing:.12em;color:var(--muted);margin-top:4px}
.leave{display:inline-grid;gap:2px;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:6px 10px;margin-top:6px;justify-self:start}
.leave small{font:700 10px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
.leave b{font:800 19px/1.1 var(--f-head);font-variant-numeric:tabular-nums}
.trip h3{color:var(--c);font-size:22px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font:700 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--muted);color:var(--muted);border-radius:99px;padding:4px 8px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;margin:8px 0 0;font-size:15px}
.facts dt{color:var(--muted);font-weight:600}
.facts dd{margin:0;overflow-wrap:anywhere}
.details{margin:8px 0 0;white-space:pre-wrap;font-size:15px}
.empty{padding:22px 18px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px;align-items:start}
.contact{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:10px}
.contact .name{font:800 22px/1.2 var(--f-head)}
.contact .role{color:var(--muted)}
.line-item{display:grid;gap:2px}
.line-item > span:first-child{font:700 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.line-item .val{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:17px;font-weight:600;overflow-wrap:anywhere;user-select:all}
form.msg{display:grid;gap:12px}
.pray{display:grid;gap:8px;background:var(--warn-bg);border-radius:8px;padding:12px}
.check{display:flex;gap:10px;align-items:center;font-weight:600}
.check input{width:auto;margin:0}
label{display:grid;gap:4px;font-weight:600;font-size:15px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;box-sizing:border-box;min-width:0}
textarea{min-height:120px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:700 15px/1 var(--f-head);border-radius:8px;padding:11px 16px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.yellow{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:transparent;color:var(--ink);border-style:dashed}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.hint{color:var(--muted);font-size:14px;margin:0}
.status{font-weight:600;font-size:14px}
.status.ok{color:var(--ok)}
footer .wrap{padding-block:0 32px;color:var(--muted);font-size:13px}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding-block:22px 4px}
.photos img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:10px;border:3px solid var(--c);box-shadow:0 0 18px var(--c);display:block}
.photos figure:nth-child(1){--c:var(--purple)}.photos figure:nth-child(2){--c:var(--mint)}.photos figure:nth-child(3){--c:var(--pink)}
.photos figure{margin:0;min-width:0}
.photos figure:nth-child(odd){transform:rotate(-1.5deg)}
.photos figure:nth-child(even){transform:rotate(1.5deg)}
@media (max-width:640px){.photos{gap:8px}.photos img{border-width:2px}}
.ed-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.ed-photos div{display:grid;gap:6px}
.ed-photos img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:6px}
.connect{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.yt{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--pink);border-radius:10px;padding:18px;display:grid;gap:10px;align-content:start}
.yt h3{font-size:20px}
.btn.yt-btn{background:var(--pink);border-color:var(--pink);color:#fff;justify-self:start}
.share{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--mint);border-radius:10px;padding:18px;display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center}
.share img{width:120px;height:120px;border-radius:8px;background:#fff;padding:6px;box-sizing:border-box}
.share .url{font:500 13px/1.4 var(--f-mono);overflow-wrap:anywhere;user-select:all;color:var(--muted)}
@media (max-width:400px){.share{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:700 13px/1 var(--f-head);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:9px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--mint);color:var(--accent-ink);border-color:var(--mint)}
.ev-acts{margin-top:12px}
.season{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:8px;margin:0;min-width:0;align-content:start}
.s-series{border-top:4px solid var(--orange)}
.s-series h3{font-size:24px;color:var(--orange)}
.s-verse{border-top:4px solid var(--lime)}
.s-verse blockquote{margin:0;font:600 19px/1.45 var(--f-body);text-wrap:pretty}
.s-verse figcaption{font:700 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--lime)}
.faq{display:grid;gap:8px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 16px;min-width:0}
.faq summary{cursor:pointer;font:700 17px/1.3 var(--f-head);padding:14px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.faq details p{margin:0 0 16px;white-space:pre-wrap;max-width:68ch}
.ask-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.ask{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:10px;align-content:start;min-width:0}
.ask .btn{justify-self:start}
.ask h3{font-size:21px}
.pray-card{border-top:4px solid var(--purple)}
.ask-card{border-top:4px solid var(--mint)}
.safety{margin:0;padding:12px 14px;border-left:4px solid var(--orange);background:var(--surface);border-radius:0 8px 8px 0;font-size:15px;color:var(--muted)}
.jump{display:flex;flex-wrap:wrap;gap:8px;padding-block:14px 0}
.jump a{font:700 14px/1 var(--f-head);text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:10px 16px}
.jump a:hover{border-color:var(--mint);color:var(--mint)}
h2[id]{scroll-margin-top:16px}
.sub{display:grid;gap:10px}
.sub-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.sub-head h3{font-size:19px;color:var(--ink)}
.reach{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:start}
.cred{color:var(--muted);font-size:15px}
.church-card{border-top:4px solid var(--orange)}
.yp-card{border-top:4px solid var(--pink)}
.msg-card{max-width:720px}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.game{border-top:4px solid var(--lime)}
.game h3{font-size:22px;color:var(--lime)}
.game .btn{justify-self:start}
.permit{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:10px;padding:16px 18px}
.permit div{display:grid;gap:4px;min-width:0;flex:1 1 260px}
.permit b{font:800 18px/1.2 var(--f-head)}
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:start}
.plan{list-style:none;margin:0;padding:0;display:grid;gap:0}
.plan li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.plan li:first-child{border-top:0}
.plan .d{font:700 12px/1.6 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.plan .r{font-weight:700}
.plan .n{display:block;color:var(--muted);font-size:14px}
.plan a{color:var(--ink);text-decoration-color:var(--line)}
.starters{margin:0;padding-left:20px;display:grid;gap:10px}
.starters li{padding-left:4px}
.w-read{border-top:4px solid var(--mint)}
.w-talk{border-top:4px solid var(--orange)}
.subs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vol{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--lime);border-radius:10px;padding:16px 18px}
.vol div{display:grid;gap:4px;min-width:0;flex:1 1 260px}
.vol b{font:800 18px/1.2 var(--f-head)}
.social{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--purple);border-radius:10px;padding:18px;display:grid;gap:10px;align-content:start}
.social h3{font-size:20px}
.btn.ig{background:var(--purple);border-color:var(--purple);color:#fff}
/* editor */
.editor{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:18px;display:grid;gap:22px}
.editor fieldset{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:12px;margin:0;min-width:0}
.editor legend{font:800 17px/1 var(--f-head);padding:0 6px}
.ed-item{display:grid;gap:10px;padding:12px;border:1px dashed var(--line);border-radius:8px}
.ed-bar{position:sticky;bottom:0;background:var(--surface);padding-block:10px;border-top:1px solid var(--line)}
@media (max-width:640px){
  .two{grid-template-columns:1fr}
  .trip{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

o to Pastor Craig, with a copy to the church office, and are kept private. If something you share tells us someone may be in danger or being hurt, we will share it only with the people needed to keep them safe.","services":[{"day":"Sunday","name":"Sunday School","time":"10:00 AM","place":""},{"day":"Sunday","name":"Morning Worship","time":"11:00 AM","place":"","note":"Youth will meet in the sanctuary between 11:00 and 12:30"},{"day":"Sunday","name":"Evening Service","time":"5:30–7:00 PM","place":""}],"churchInfo":{"address":"2590 Riverside Dr, Bassett, VA 24055","phone":"(276) 629-2754","email":"office@firstbaptistbassett.com","hours":"","website":"https://www.firstbaptistbassett.com/","pastor":""},"games":[{"title":"Counterfeit Check","tag":"I AM series · Disciples Indeed","desc":"You’re the bank teller. Stamp each Bible statement real or counterfeit, then see the verse that settles it. 12 bills per shift.","url":"counterfeit-check.html","label":"Play Counterfeit Check"}],"permissionForm":"https://docs.google.com/forms/d/e/1FAIpQLScv84wXPsTdFVIuo5N6mmBd65rSvkw1-_52PRctH4XCu0LL7Q/viewform","week":{"label":"Week of Nov 11","planTitle":"Disciples Indeed: living in His Word","topic":"Wednesday night Jesus told people who believed Him how to know their faith is real: “If you abide in My word, you are My disciples indeed” (John 8:31). This week’s challenge: read all of John 8, and test one thing you hear against Scripture (Acts 17:11).","plan":[{"day":"Thu","ref":"John 8:12-30","note":"“I am the light of the world.” Many believed."},{"day":"Fri","ref":"John 8:31-59","note":"“Disciples indeed” and “Before Abraham was, I AM”"},{"day":"Sat","ref":"Hosea 4:1-6","note":"“Destroyed for lack of knowledge”"},{"day":"Sun","ref":"John 5:36-47","note":"They searched the Scriptures but wouldn’t come to Him"},{"day":"Mon","ref":"Matthew 15:1-14","note":"Blind leaders of the blind"},{"day":"Tue","ref":"John 15:1-11","note":"“Abide in Me” (the same word as John 8:31)"},{"day":"Wed","ref":"Acts 17:10-12","note":"The Bereans checked everything against Scripture"}],"parentNote":"Pick one at dinner or in the car. Let your student do most of the talking.","starters":["In John 8, many people “believed” Jesus, but by the end of the chapter they picked up stones (verses 30 and 59). What went wrong? (Hint: verse 37.)","What’s the difference between agreeing with Jesus and following Him?","Did you test something you heard against Scripture this week? What did you find?","If abiding in His Word doesn’t earn salvation (Ephesians 2:8–9), what does it show?"]},"calendarIcs":"https://bassettyouth.vercel.app/youth.ics","volunteerForm":"https://docs.google.com/forms/d/1PLqw0yBoHNDSyh4p7uLEaWdSQarEhVluX1hSp8Z_R8I/viewform","instagram":"https://www.instagram.com/fbcbstudentministries/","threads":"https://www.threads.com/@fbcbstudentministries","socialHandle":"fbcbstudentministries"}</script><script id="app-js">

function addPhoto(file){
  if(!file||!/^image\//.test(file.type))return;
  var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){
    var sc=Math.min(1,700/img.height,560/img.width);var c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);draft.photos=(draft.photos||[]).concat(c.toDataURL('image/jpeg',0.8));render();};img.src=r.result;};
  r.readAsDataURL(file);
}

function buildDoc(s){
  var json=JSON.stringify(s).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    HEAD_EXTRA+'<style id="page-style">'+SRC_STYLE+'</style><div id="app"></div><script type="application/json" id="state">'+json+'</'+'script><script id="app-js">'+SRC_APP+'</'+'script></body></html>';
}
function publish(){
  if(!artifactNs)return;
  draft.updated=new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  var btn=document.getElementById('e-publish');if(btn)btn.disabled=true;
  pubStatus='Publishing…';render();
  artifactNs.publish(buildDoc(draft)).then(function(){pubStatus='Published';},function(err){
    var code=err&&err.code;
    pubStatus=code==='conflict'?'Someone saved a newer version first. The page will reload to it; make your edits again.':
      (code==='not_granted'||code==='not_writer')?'This account can view the page but not change it.':'Could not publish. Check your connection and press Publish again.';
    render();});
}

    h('footer',{},h('div',{class:'wrap',text:state.updated?'Last updated '+state.updated:''}))).filter(Boolean));
}

})();
